# Netlify Configuration
[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Redirect all SPA routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self' https: 'unsafe-inline' 'unsafe-eval' *.googleapis.com *.gstatic.com *.tradingview.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.googleapis.com *.gstatic.com *.tradingview.com; img-src 'self' https: data:;"

# Cache control
[[headers]]
  for = "/*.{js,css,woff,woff2,ttf,eot,svg,jpg,jpeg,png,gif}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Environment context
[context.production]
  environment = { ENVIRONMENT = "production" }

[context.deploy-preview]
  environment = { ENVIRONMENT = "preview" }

[context.branch-deploy]
  environment = { ENVIRONMENT = "staging" }
